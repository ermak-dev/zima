[package]
name = "player_to_ros2"
version = "0.1.0"
edition = "2021"
publish = false

# Message types come from ros-env: it picks up the Rust bindings that
# rosidl generated into the sourced ROS workspace (the colcon workspace
# at ~/robot/ros-ws). The crates.io entries named
# sensor_msgs etc. are non-functional stubs, which is why they are not
# used directly.
[dependencies]
player-bridge = { path = "../player-bridge" }
rclrs = "0.8"
ros-env = "0.3"
tf2_msgs = { path = "./ros-ws/install/tf2_msgs/share/tf2_msgs/rust" }

[[bin]]
name = "player_to_ros2"
path = "src/main.rs"
