[package]
name = "mask-owner"
version = "0.1.0"
edition = "2021"
publish = false

# Dependencies stay workspace-local: player-bridge provides rollback XDR.
# The legacy mask-owner musl build stays static; the single-ELF supervisor
# uses GNU/glibc so its embedded C guard can load the robot's ALSA library.
[features]
audio-testing = []

[dependencies]
player-bridge = { path = "../player-bridge" }

[[bin]]
name = "mask-owner"
path = "src/main.rs"

[[bin]]
name = "robot-supervisor"
path = "src/bin/robot-supervisor.rs"

[lib]
name = "mask_owner"
path = "src/lib.rs"
