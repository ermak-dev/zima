[package]
name = "mask-owner"
version = "0.1.0"
edition = "2021"
publish = false

# Dependencies stay workspace-local only: player-bridge provides the XDR
# velocity command used by the rollback path, keeping the ARM cross-build
# fully static with no external crates (see tools/arm-lld.sh).
[dependencies]
player-bridge = { path = "../player-bridge" }

[[bin]]
name = "mask-owner"
path = "src/main.rs"

[[bin]]
name = "robot-supervisor"
path = "src/bin/robot-supervisor.rs"

[lib]
name = "mask_owner"
path = "src/lib.rs"
