amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: /scan
    tf_broadcast: true
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    min_particles: 100
    max_particles: 2000
    laser_model_type: likelihood_field
    odom_model_type: diff-corrected
    robot_radius: 0.17
    transform_tolerance: 1.0

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ./maps/mapping_drive_20261004.yaml

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    # Turning in place counts as progress: a U-turn toward the goal at
    # 0.3 rad/s takes ~10 s without moving 5 cm.
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.05
      required_movement_angle: 0.3
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
      stateful: true
    # Regulated Pure Pursuit: follows the global path at a steady crawl.
    # DWB with acc_lim_x 0.1 at 20 Hz samples a +-0.005 m/s window per
    # cycle and stalled ~0.24 m short of every goal in the sandbox; the
    # acceleration limits now live in the velocity smoother.
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.06
      lookahead_dist: 0.3
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.5
      lookahead_time: 2.0
      use_velocity_scaled_lookahead_dist: false
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.3
      rotate_to_heading_min_angle: 0.6
      max_angular_accel: 1.0
      allow_reversing: false
      transform_tolerance: 0.5
      min_approach_linear_velocity: 0.02
      approach_velocity_scaling_dist: 0.3
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.02
      max_robot_pose_search_dist: 10.0

# In the distro chain every Nav2 velocity source (the controller and the
# recovery behaviors; the stock tree backs up at 0.15 m/s) passes through
# the smoother before the collision monitor: these bounds are the stack's
# ceiling and stay within the project limits (0.1 m/s, 0.4 rad/s).
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.06, 0.0, 0.3]
    min_velocity: [-0.06, 0.0, -0.3]
    max_accel: [0.3, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.5]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    odom_topic: odom

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap:
      robot_radius: 0.17

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.17
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          raytrace_range: 5.5
          obstacle_range: 5.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.25
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.17
      resolution: 0.05
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          raytrace_range: 5.5
          obstacle_range: 5.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.25
      always_send_full_costmap: true

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel
    cmd_vel_out_topic: cmd_vel_nav2
    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: false
    polygon_pub_frequency: 1.0
    polygons: ['RobotFootprint']
    RobotFootprint:
      type: 'polygon'
      action_type: 'none'
      polygon_sub_topic: 'polygon_footprint'
      footprint_topic: '/local_costmap/published_footprint'
      points: '[]'
    observation_sources: ['noop_scan']
    noop_scan:
      type: 'scan'
      topic: '/nonexistent_noop_scan'
      min_height: -0.2
      max_height: 0.3

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    base_frame: base_link
    fixed_frame: odom
    dock_plugins: ['noop_dock']
    noop_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.16
      external_detection_translation_y: 0.0
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
      replacement_tolerance: 0.1
