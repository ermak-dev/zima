amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: /scan
    tf_broadcast: true
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    # The vacuum odom drifts slowly and the laser is the only exteroceptive
    # sensor: a generous particle cloud keeps localization responsive on
    # the small test map.
    min_particles: 100
    max_particles: 2000
    laser_model_type: likelihood_field
    odom_model_type: diff-corrected
    robot_radius: 0.17
    transform_tolerance: 1.0

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ./maps/mapping_drive_20261004.yaml
