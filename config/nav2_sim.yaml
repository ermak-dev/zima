# Overlay for the offline Nav2 playground (`robot run --sim`), applied
# after nav2_drive.yaml (the driving chain and collision monitor shared
# with the live robot). Base limits come from nav2_replay.yaml
# (vacuum-safe: 0.06 m/s, 0.3 rad/s). What only the simulator world needs:
# - the TB3 sandbox spawns the robot at (-2.0, -0.5), so AMCL's hardcoded
#   initial pose from the replay config (0, 0) lands the localization in a
#   wrong cell and every plan is rejected.
amcl:
  ros__parameters:
    initial_pose:
      x: -2.0
      y: -0.5
      z: 0.0
      yaw: 0.0
