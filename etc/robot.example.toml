# Copy to etc/robot.toml and chmod 600 before use. Never commit that file.
# Paths are relative to this file's directory. CLI > environment > TOML > defaults.
[robot]
ssh_host = "robot"
player_host = "" # Empty: resolve the SSH alias for Player.
player_port = 6665

[server]
listen = "127.0.0.1"
port = 8085

[supervisor]
host = "" # Empty: use the resolved robot host.
port = 7665
timeout_ms = 5000
listen = "127.0.0.1"
binary = "../crates/target/armv7-unknown-linux-gnueabihf/release/robot-supervisor"
# An empty token disables authentication entirely; the supervisor API must
# not listen beyond localhost without a generated private token.
token = ""

[run]
slam_adapter = "../tools/mrpt-adapter/adapter"
yolo_adapter = "../tools/yolo/adapter"
# Unified session bundle; empty disables. Choose a new directory for each run.
record_dir = ""

[camera]
netrc = "~/.config/robot/camera.netrc"
snapshot_url = "http://cam/image.jpg"
mjpeg_url = "http://cam/mjpeg"
audio_url = "http://cam/audio.opus"

[audio]
profile = "" # Optional legacy JSON profile; audio --config remains a JSON flag.
# endpoint = "http://127.0.0.1:8085" # Optional remote API; otherwise follows [server].
volume = 0.35
max_volume = 0.9

[yandex]
# A key is not consent. Explicitly enable cloud TTS when desired.
enabled = false
api_key = ""
url = "https://tts.api.cloud.yandex.net/speech/v1/tts:synthesize"
voice = "filipp"
folder_id = ""

[slam]
# Opt-in local raw Player JSONL capture; creates a new private file, never overwrites.
record_path = ""
icp_min_goodness = 0.30
icp_max_iterations = 40
icp_threshold_dist = 0.75
icp_decimation = 1
insertion_linear = 0.10
insertion_angular_deg = 10.0
grid_resolution = 0.05
max_insert_range = 5.0
# Frame-to-frame admission budgets; these do not limit wheel speeds.
max_uncompensated_translation = 0.08
max_uncompensated_rotation_deg = 8.0
adapter_timeout_ms = 1500
max_pose_age_ms = 500
odom_max_skew_ms = 100
# Verification flags assert measured clock semantics, not a desired processing mode.
source_time_verified = false
beam_time_verified = false
# Player does not yet provide verified per-beam times. Keep this disabled.
deskew_enabled = false

[providers]
# Only string *_api_key entries; exports ROBOT_PROVIDER_<UPPERCASE_KEY>.
openrouter_api_key = ""
