name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Robot controller tests
        run: bash tests/test_robot.sh
      - name: Camera snapshot tests
        run: bash tests/test_robot_camera.sh
      - name: Bug tracker CLI tests
        run: python3 tests/test_robot_bug.py
      - name: shellcheck
        run: shellcheck bin/robot bin/camera/snapshot tests/*.sh
